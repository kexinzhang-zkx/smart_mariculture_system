# ================================================================
#  gateway.conf — GEC6818 网关配置文件
# ================================================================

[serial]
device = /dev/ttySAC2
baud   = 115200

[local_mqtt]
broker = 127.0.0.1
port   = 1883

[cloud_mqtt]
broker = 118.178.236.156
port   = 1883
user   = admin
pass   = 123456

[topics]
sensor_raw   = /stm32/data
sensor_cloud = /aquaculture/sensor
control      = /aquaculture/control
status       = /aquaculture/status

[performance]
ringbuf_size = 32
heartbeat_interval = 60
qos          = 0

[log]
log_file = /var/log/gateway.log
log_level = INFO
